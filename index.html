<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文化日 2026 · 中国展台看板</title>
<style>
  :root{
    --bg:#faf5ec;           /* 象牙米白底 */
    --surface:#ffffff;      /* 白卡片 */
    --surface-2:#fdf8f0;
    --ink:#2b2016;          /* 深墨褐 */
    --muted:#8a7a66;
    --border:#e7d9c4;       /* 米金描边 */
    --line:#ecdcc4;
    --card:#ffffff;
    --txt:#3a2f22;
    --accent:#c8102e;       /* 中国红 */
    --accent-2:#b8860b;     /* 描金 */
    --gold:#c9a227;
    --ok:#2e7d32;
    --warn:#b8860b;
    --gap:#c8102e;
    --radius:14px;
    --shadow:0 8px 26px rgba(140,90,40,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
    background-color:var(--bg);
    /* 象牙底 + 淡红金回纹/云纹暗纹（纯 CSS，多层低透明渐变叠加） */
    background-image:
      radial-gradient(circle at 18% 12%, rgba(200,16,46,.05), transparent 42%),
      radial-gradient(circle at 84% 8%,  rgba(201,162,39,.07), transparent 40%),
      radial-gradient(circle at 92% 78%, rgba(200,16,46,.045), transparent 44%),
      radial-gradient(circle at 8% 92%,  rgba(201,162,39,.06), transparent 42%),
      /* 细网格回纹 */
      repeating-linear-gradient(45deg, rgba(200,16,46,.028) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(-45deg, rgba(184,134,11,.028) 0 1px, transparent 1px 22px);
    background-attachment:fixed;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:28px 20px 80px}

  /* ---- header ---- */
  header.top{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;margin-bottom:6px;
    border-bottom:2px solid var(--accent);padding-bottom:18px;
    position:relative;
  }
  header.top:after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--gold);opacity:.55}
  .title h1{margin:0;font-size:27px;letter-spacing:.5px;color:var(--accent);font-weight:800}
  .title .sub{color:var(--muted);font-size:13px;margin-top:5px}
  .title .sub b{color:var(--accent-2);font-weight:700}
  .stamp{
    font-size:12px;color:var(--accent);border:1.5px solid var(--accent);
    padding:6px 14px;border-radius:999px;background:#fff;
    white-space:nowrap;box-shadow:0 2px 8px rgba(200,16,46,.10);
  }

  /* ---- KPI row ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0 8px}
  .kpi{
    background:linear-gradient(180deg,#fff,var(--surface-2));
    border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;position:relative;overflow:hidden;
    box-shadow:var(--shadow);
  }
  .kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .kpi.gold:before{background:linear-gradient(180deg,var(--gold),var(--accent))}
  .kpi .k{font-size:12px;color:var(--muted);letter-spacing:.4px}
  .kpi .v{font-size:27px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .kpi .v small{font-size:13px;color:var(--muted);font-weight:500}
  .kpi .d{font-size:12px;color:var(--muted);margin-top:2px}

  /* ---- tabs ---- */
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:26px 0 18px;position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--bg) 72%,rgba(250,245,236,0));padding:10px 0 12px}
  nav.tabs button{
    background:#fff;color:var(--muted);border:1px solid var(--border);
    padding:9px 16px;border-radius:999px;font-size:13.5px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  nav.tabs button:hover{color:var(--accent);border-color:var(--accent)}
  nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;
    box-shadow:0 4px 14px rgba(200,16,46,.28)}

  section.panel{display:none}
  section.panel.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  h2.sec{font-size:14px;color:var(--accent);font-weight:700;letter-spacing:1px;
    margin:26px 0 12px;display:flex;align-items:center;gap:10px}
  h2.sec:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}

  /* ---- food grid ---- */
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
  .person{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:15px 16px;transition:.15s;border-top:3px solid var(--accent);
    box-shadow:0 3px 12px rgba(140,90,40,.07);
  }
  .person:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
  .person .who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:10px;color:var(--ink)}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .dot.ok{background:var(--ok)} .dot.pd{background:var(--gold)}
  .person ul{margin:0;padding:0;list-style:none}
  .person li{font-size:13.5px;color:#4a3d2c;padding:3px 0 3px 14px;position:relative}
  .person li:before{content:"";position:absolute;left:0;top:11px;width:5px;height:5px;
    border-radius:50%;background:var(--accent);opacity:.75}
  .person .note{margin-top:8px;font-size:12px;color:var(--accent)}
  .person li.dup{color:#a10d26}
  .tagdup{display:inline-block;margin-left:7px;font-size:10.5px;line-height:1;padding:2px 6px;
    border-radius:999px;background:rgba(200,16,46,.12);color:var(--accent);border:1px solid rgba(200,16,46,.4);
    vertical-align:middle;font-weight:700}
  .tagcur{display:inline-block;font-size:10.5px;line-height:1;padding:2px 7px;border-radius:999px;font-weight:700}
  .tagcur.cny{background:rgba(184,134,11,.14);color:#8a6408;border:1px solid rgba(184,134,11,.45)}
  .tagcur.sgd{background:rgba(200,16,46,.10);color:var(--accent);border:1px solid rgba(200,16,46,.35)}
  .tbd{color:var(--accent);font-size:12px}
  .row.tot{border-top:2px solid rgba(200,16,46,.25);margin-top:4px;padding-top:9px}
  .row.tot .r-item{font-weight:700;color:var(--accent)}

  /* ---- food summary ---- */
  .summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .sumcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    border-top:3px solid var(--gold);box-shadow:0 3px 12px rgba(140,90,40,.07)}
  .sumcard .sc-head{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:9px;
    color:var(--accent)}
  .sumcard .sc-n{font-size:11px;font-weight:700;color:#fff;background:var(--gold);
    border-radius:999px;padding:1px 8px;line-height:1.6}
  .sumcard ul{margin:0;padding-left:16px}
  .sumcard li{font-size:13px;color:var(--txt);line-height:1.9}

  /* ---- decor cards ---- */
  .decor{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .card{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;cursor:zoom-in;transition:.18s;display:flex;flex-direction:column;
    box-shadow:0 3px 12px rgba(140,90,40,.07);
  }
  .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
  .card .thumb{aspect-ratio:4/3;background:#f3ead9;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card .meta{padding:12px 14px 14px}
  .card .meta .nm{font-size:14.5px;font-weight:700;color:var(--ink)}
  .card .meta .qt{font-size:13px;color:var(--accent-2);margin-top:3px;font-variant-numeric:tabular-nums;font-weight:600}
  .card .meta .by{font-size:12px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
  .card .meta .by .zoomlink{color:var(--accent)}

  /* ---- simple rows (equipment/supplies/nophoto) ---- */
  .rows{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
    box-shadow:0 3px 12px rgba(140,90,40,.06)}
  .row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px}
  .row:nth-child(even){background:var(--surface-2)}
  .row:last-child{border-bottom:none}
  .row .r-item{font-weight:700;min-width:110px;color:var(--ink)}
  .row .r-qty{color:var(--accent-2);font-variant-numeric:tabular-nums;min-width:120px;font-weight:600}
  .row .r-by{color:var(--muted);font-size:13px;flex:1}
  .badge{font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
  .badge.ok{background:rgba(46,125,50,.12);color:var(--ok)}
  .badge.pd{background:rgba(184,134,11,.14);color:#8a6408}
  .badge.gap{background:rgba(200,16,46,.12);color:var(--accent)}

  /* ---- sponsors ---- */
  .sponsors{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .sponsor{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;
    border-left:4px solid var(--gold);box-shadow:0 3px 12px rgba(140,90,40,.07)}
  .sponsor .s-nm{font-weight:700;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ink)}
  .sponsor .s-note{font-size:12.5px;color:var(--muted);margin-top:8px}
  .sponsor.off{opacity:.72;border-left-color:var(--muted);background:#f7f2e9}
  .sponsor.off .s-nm{text-decoration:line-through;text-decoration-color:var(--muted)}

  /* ---- finance ---- */
  .fin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:20px}
  .fin{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;
    border-top:3px solid var(--accent);box-shadow:0 3px 12px rgba(140,90,40,.07)}
  .fin .k{font-size:12.5px;color:var(--muted)}
  .fin .v{font-size:30px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .fin.big{border-top-color:var(--gold)}
  .fin.big .v{font-size:36px;color:var(--accent)}
  .bar{height:10px;border-radius:999px;background:#efe4cf;overflow:hidden;margin-top:14px;border:1px solid var(--border)}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
  .empty{color:var(--muted);font-size:13.5px;border:1px dashed var(--border);border-radius:var(--radius);
    padding:22px;text-align:center;background:#fff}

  /* ---- lightbox ---- */
  #lb{position:fixed;inset:0;background:rgba(43,32,22,.88);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;z-index:100;padding:30px}
  #lb.on{display:flex;animation:fade .2s}
  #lb .box{max-width:min(880px,92vw);max-height:88vh;display:flex;flex-direction:column;
    background:#fff;border:2px solid var(--gold);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
  #lb img{max-width:100%;max-height:66vh;object-fit:contain;background:#f3ead9;display:block}
  #lb .cap{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  #lb .cap .nm{font-size:17px;font-weight:700;color:var(--accent)}
  #lb .cap .qt{font-size:14px;color:var(--accent-2);font-weight:600}
  #lb .cap .by{font-size:13px;color:var(--muted)}
  #lb .cap .nt{font-size:13px;color:#4a3d2c;width:100%;margin-top:4px}
  #lb .x{position:absolute;top:22px;right:26px;font-size:30px;color:#fff;cursor:pointer;line-height:1;opacity:.8}
  #lb .x:hover{opacity:1}

  footer{margin-top:50px;padding-top:20px;border-top:2px solid var(--gold);
    color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  code{background:#f3ead9;padding:1px 6px;border-radius:5px;font-size:12px;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">
      <h1 id="m-title">文化日 2026 · 中国展台</h1>
      <div class="sub" id="m-sub"></div>
    </div>
    <div class="stamp">最后更新 · <span id="stamp"></span></div>
  </header>

  <div class="kpis" id="kpis"></div>

  <nav class="tabs" id="tabs"></nav>
  <main id="panels"></main>

  <footer>
    <span>单文件看板 · 数据在 <code>data.js</code>，改完刷新即可</span>
    <span>点击装饰卡片可放大查看 / 细节</span>
  </footer>
</div>

<div id="lb"><span class="x" onclick="closeLb()">&times;</span>
  <div class="box">
    <img id="lb-img" alt="">
    <div class="cap">
      <span class="nm" id="lb-nm"></span>
      <span class="qt" id="lb-qt"></span>
      <span class="by" id="lb-by"></span>
      <span class="nt" id="lb-nt"></span>
    </div>
  </div>
</div>

<script src="data.js?v=20261006d"></script>
<script>
const D = window.BOARD;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// header
$('#m-title').textContent = D.meta.title;
$('#m-sub').innerHTML = D.meta.subtitle + ' · <b>' + esc(D.meta.date) + '</b> · 负责人：' + esc(D.meta.owner);
$('#stamp').textContent = new Date().toLocaleDateString('zh-CN');

// ---- KPIs ----
(function(){
  const foodPeople = D.food.length;
  const confirmedFood = D.food.filter(f=>f.status==='confirmed').length;
  const sponsorsOk = D.sponsors.filter(s=>s.status==='confirmed').length;
  const sponsorsRej = D.sponsors.filter(s=>s.status==='rejected').length;
  const decorCount = D.decor.length + D.decorNoPhoto.length;
  const gaps = D.supplies.filter(s=>s.status==='gap').length + (D.meta.date? 0:0);
  const todoCnt = D.supplies.filter(s=>s.status==='todo').length;
  const f = D.finance;
  const line = x => (x.unit==null) ? null : x.unit*x.qty;
  const spentSum = (f.spent||[]).reduce((a,b)=>a+(line(b)||0),0);
  const remain = (f.budget!=null) ? f.budget : null;

  const k = [
    {k:'食物接龙', v: foodPeople, u:'人', d: confirmedFood+' 人已确认 / '+(foodPeople-confirmedFood)+' 人待补'},
    {k:'装饰品', v: decorCount, u:'项', d:'含 '+(D.decor.length)+' 项实拍图'},
    {k:'赞助商', cls:'gold', v: D.sponsors.length, u:'家', d: sponsorsOk+' 家已确认'+(sponsorsRej?' / '+sponsorsRej+' 家已拒':'')},
    {k:'剩余资金', cls:'gold', v: remain==null?'—':(f.currency+' '+remain), u:'', d: remain==null?'未填收入':('募入 '+f.currency+' '+f.budget+' · 已花 ¥'+spentSum)},
    {k:'待办缺口', v: gaps, u:'项', d:'餐勺 · 成分表'},
    {k:'待采购', v: todoCnt, u:'项', d:'野餐盒 · 雪糕棍'}
  ];
  $('#kpis').innerHTML = k.map(x=>`
    <div class="kpi ${x.cls||''}">
      <div class="k">${esc(x.k)}</div>
      <div class="v">${esc(x.v)}<small> ${esc(x.u)}</small></div>
      <div class="d">${esc(x.d)}</div>
    </div>`).join('');
})();

// ---- Tabs ----
const TABS = [
  {id:'food',   label:'食物接龙'},
  {id:'decor',  label:'装饰品'},
  {id:'sponsor',label:'赞助商'},
  {id:'gear',   label:'现场设备与耗材'},
  {id:'money',  label:'财务'}
];
$('#tabs').innerHTML = TABS.map((t,i)=>`<button data-t="${t.id}" class="${i===0?'on':''}">${t.label}</button>`).join('');
$('#tabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on', x===b));
  document.querySelectorAll('section.panel').forEach(p=>p.classList.toggle('on', p.dataset.p===b.dataset.t));
});

// ---- Panels ----
function panelFood(){
  const cards = D.food.map(p=>{
    const ok = p.status==='confirmed';
    return `<div class="person">
      <div class="who"><span class="dot ${ok?'ok':'pd'}"></span>${esc(p.name)}
        <span class="badge ${ok?'ok':'pd'}" style="margin-left:auto">${ok?'已确认':'待补充'}</span></div>
      <ul>${p.items.map(i=>{
        const dup = (p.dups||[]).includes(i);
        return `<li${dup?' class="dup"':''}>${esc(i)}${dup?'<span class="tagdup">重复</span>':''}</li>`;
      }).join('')}</ul>
      ${p.note?`<div class="note">待办：${esc(p.note)}</div>`:''}
    </div>`;
  }).join('');
  const sumCards = (D.foodSummary||[]).map(g=>`
    <div class="sumcard">
      <div class="sc-head">${esc(g.cat)}<span class="sc-n">${g.items.length}</span></div>
      <ul>${g.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
    </div>`).join('');
  return `<section class="panel on" data-p="food">
    <h2 class="sec">食物接龙 · ${D.food.length} 人</h2>
    <div class="people">${cards}</div>
    <h2 class="sec">菜品归类汇总</h2>
    <div class="summary">${sumCards}</div>
  </section>`;
}
function panelDecor(){
  const cards = D.decor.map((d,i)=>`
    <div class="card" onclick="openLb(${i})">
      <div class="thumb"><img loading="lazy" src="${esc(d.photo)}" alt="${esc(d.item)}"></div>
      <div class="meta">
        <div class="nm">${esc(d.item)}</div>
        <div class="qt">${esc(d.qty)}</div>
        <div class="by"><span>提供：${esc(d.by||'—')}</span><span class="zoomlink">放大 ⤢</span></div>
      </div>
    </div>`).join('');
  const rows = D.decorNoPhoto.map(d=>`
    <div class="row"><span class="r-item">${esc(d.item)}</span>
      <span class="r-qty">${esc(d.qty)}</span>
      <span class="r-by">${esc(d.by||'')}</span></div>`).join('');
  return `<section class="panel" data-p="decor">
    <h2 class="sec">装饰品 · 实拍 ${D.decor.length} 项（点击放大）</h2>
    <div class="decor">${cards}</div>
    <h2 class="sec">装饰品 · 无图清单</h2>
    <div class="rows">${rows}</div>
  </section>`;
}
function panelSponsor(){
  const stBadge = st => st==='confirmed'?'<span class="badge ok">已确认</span>'
    : st==='rejected'?'<span class="badge gap">已拒绝</span>'
    : '<span class="badge pd">待确认</span>';
  const cards = D.sponsors.map(s=>`
    <div class="sponsor${s.status==='rejected'?' off':''}">
      <div class="s-nm">${esc(s.name)}
        ${stBadge(s.status)}</div>
      <div class="s-note">${esc(s.note||'')}</div>
    </div>`).join('');
  const okN = D.sponsors.filter(s=>s.status==='confirmed').length;
  const rejN = D.sponsors.filter(s=>s.status==='rejected').length;
  return `<section class="panel" data-p="sponsor">
    <h2 class="sec">赞助商 · ${D.sponsors.length} 家（已确认 ${okN} · 已拒绝 ${rejN}）</h2>
    <div class="sponsors">${cards}</div></section>`;
}
function panelGear(){
  const badge = st => st==='confirmed'?'<span class="badge ok">已备</span>'
    : st==='gap'?'<span class="badge gap">缺口</span>'
    : st==='todo'?'<span class="badge pd">待采购</span>':'<span class="badge pd">待定</span>';
  const eq = D.equipment.map(e=>`
    <div class="row"><span class="r-item">${esc(e.item)}</span>
      <span class="r-qty">${esc(e.qty)}</span>
      <span class="r-by">提供：${esc(e.by||'—')}</span></div>`).join('');
  const byStatus = list => list.sort((a,b)=>{
    const rank = s => s.status==='confirmed'?0 : s.status==='todo'?1 : 2;
    return rank(a)-rank(b);
  });
  const sp = byStatus(D.supplies.slice()).map(s=>`
    <div class="row"><span class="r-item">${esc(s.item)}</span>
      <span class="r-qty">${esc(s.qty)}</span>
      <span class="r-by">${s.by?'提供：'+esc(s.by):(s.note?esc(s.note):'')}</span>
      ${badge(s.status)}</div>`).join('');
  return `<section class="panel" data-p="gear">
    <h2 class="sec">现场设备</h2><div class="rows">${eq}</div>
    <h2 class="sec">现场物资与耗材</h2><div class="rows">${sp}</div>
  </section>`;
}
function panelMoney(){
  const f = D.finance;
  const line = x => (x.unit==null) ? null : x.unit*x.qty;
  const spentSum = (f.spent||[]).reduce((a,b)=>a+(line(b)||0),0);
  const budget = f.budget;
  const remain = budget!=null? budget : null;
  const pct = budget? Math.min(100, Math.round(spentSum/budget*100)) : 0;
  const curTag = c => c==='SGD' ? '<span class="tagcur sgd">SGD</span>' : '<span class="tagcur cny">¥</span>';
  const def = (f.spent||[]).map(x=>{
    const amt = line(x);
    const price = (x.unit==null) ? '<span class="tbd">单价待补</span>' : (x.unit+' × '+x.qty+' = <b>'+amt+'</b>');
    return `<div class="row"><span class="r-item">${esc(x.item)}</span>
        <span class="r-qty">${price}</span>
        <span class="r-by">${curTag(x.cur||'CNY')}</span></div>`;
  }).join('');
  const defTotal = `<div class="row tot"><span class="r-item">合计（人民币）</span>
      <span class="r-qty"><b>¥${spentSum}</b></span>
      <span class="r-by">${(f.spent||[]).filter(x=>x.unit==null).length? '含 '+((f.spent||[]).filter(x=>x.unit==null).length)+' 项待补价':''}</span></div>`;
  const todoRows = '';
  const readyRows = '';
  return `<section class="panel" data-p="money">
    <h2 class="sec">财务总览</h2>
    <div class="fin-grid">
      <div class="fin"><div class="k">募集总收入</div><div class="v">${budget==null?'—':'SGD '+budget}</div></div>
      <div class="fin"><div class="k">已花支出（人民币）</div><div class="v">¥${spentSum}</div>
        <div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="fin big"><div class="k">募集余额（SGD）</div><div class="v">${remain==null?'—':'SGD '+remain}</div>
        <div class="d" style="font-size:12px;color:var(--muted);margin-top:6px">募集款未动用 · 上述支出由人民币另行支付</div></div>
    </div>
    <h2 class="sec">捐赠人（SGD）</h2>
    <div class="rows">${(f.donors&&f.donors.length)?f.donors.map(d=>`<div class="row"><span class="r-item">${esc(d.name)}</span><span class="r-qty">SGD ${esc(d.amount)}</span><span class="r-by">捐赠</span></div>`).join(''):'<div class="empty">暂无捐赠记录</div>'}</div>
    <h2 class="sec">支出明细（人民币）</h2>
    <div class="rows">${(f.spent&&f.spent.length)?(def+defTotal):'<div class="empty">暂无支出记录</div>'}</div>
  </section>`;
}

$('#panels').innerHTML = panelFood()+panelDecor()+panelSponsor()+panelGear()+panelMoney();

// ---- lightbox ----
function openLb(i){
  const d = D.decor[i];
  $('#lb-img').src = d.photo;
  $('#lb-nm').textContent = d.item;
  $('#lb-qt').textContent = d.qty;
  $('#lb-by').textContent = '提供：' + (d.by||'—');
  $('#lb-nt').textContent = d.note || '';
  $('#lb').classList.add('on');
}
function closeLb(){ $('#lb').classList.remove('on'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLb(); });
$('#lb').addEventListener('click', e=>{ if(e.target.id==='lb') closeLb(); });
</script>
</body>
</html>
