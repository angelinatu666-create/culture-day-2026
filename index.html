<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文化日 2026 · 中国展台 · 回顾与纪念</title>
<style>
  :root{
    --bg:#faf5ec;
    --surface:#ffffff;
    --surface-2:#fdf8f0;
    --ink:#2b2016;
    --muted:#8a7a66;
    --border:#e7d9c4;
    --line:#ecdcc4;
    --accent:#c8102e;
    --accent-2:#b8860b;
    --gold:#c9a227;
    --ok:#2e7d32;
    --radius:14px;
    --shadow:0 8px 26px rgba(140,90,40,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(200,16,46,.05), transparent 42%),
      radial-gradient(circle at 84% 8%,  rgba(201,162,39,.07), transparent 40%),
      radial-gradient(circle at 92% 78%, rgba(200,16,46,.045), transparent 44%),
      radial-gradient(circle at 8% 92%,  rgba(201,162,39,.06), transparent 42%),
      repeating-linear-gradient(45deg, rgba(200,16,46,.024) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(-45deg, rgba(184,134,11,.024) 0 1px, transparent 1px 22px);
    background-attachment:fixed;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 80px}

  /* ---------- 封面 ---------- */
  .cover{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);
    aspect-ratio:16/8;background:#2b2016;margin-bottom:26px}
  .cover img{width:100%;height:100%;object-fit:cover;object-position:50% 34%;display:block;opacity:.72}
  .cover .ov{position:absolute;inset:0;
    background:linear-gradient(to top, rgba(30,18,12,.88) 0%, rgba(30,18,12,.35) 48%, rgba(30,18,12,.12) 100%);
    display:flex;flex-direction:column;justify-content:flex-end;padding:34px 38px;color:#fff}
  .cover .cn{font-size:12px;letter-spacing:4px;color:var(--gold);font-weight:700;margin-bottom:10px}
  .cover h1{margin:0;font-size:40px;line-height:1.18;font-weight:800;letter-spacing:1px}
  .cover .tl{font-size:15px;color:#f0e3cd;margin-top:12px;max-width:660px}
  .cover .dt{font-size:12.5px;color:#d9c6a8;margin-top:14px;letter-spacing:.5px}
  .cover .seal{position:absolute;top:26px;right:30px;border:2px solid rgba(201,162,39,.8);
    color:var(--gold);border-radius:8px;padding:8px 12px;font-size:12px;letter-spacing:2px;
    font-weight:700;background:rgba(40,20,14,.35);backdrop-filter:blur(2px)}

  /* ---------- 数字条 ---------- */
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:34px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 14px;text-align:center;box-shadow:0 2px 10px rgba(140,90,40,.06)}
  .stat .v{font-size:25px;font-weight:800;color:var(--accent);line-height:1.15}
  .stat .v small{font-size:13px;color:var(--accent-2);font-weight:700;margin-left:1px}
  .stat .k{font-size:12.5px;color:var(--ink);font-weight:700;margin-top:3px}
  .stat .d{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}

  .sec-t{display:flex;align-items:baseline;gap:12px;margin:44px 0 16px;
    border-bottom:2px solid var(--accent);padding-bottom:9px}
  .sec-t h2{margin:0;font-size:20px;color:var(--accent);font-weight:800;letter-spacing:.5px}
  .sec-t span{font-size:12.5px;color:var(--muted)}

  /* ---------- 故事 ---------- */
  .story{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--accent);
    border-radius:var(--radius);padding:24px 28px;box-shadow:0 2px 10px rgba(140,90,40,.06)}
  .story p{margin:0 0 14px;font-size:14.5px;line-height:1.85;color:var(--txt,#3a2f22)}
  .story p:last-child{margin-bottom:0}
  .story p:first-child::first-letter{font-size:34px;font-weight:800;color:var(--accent);float:left;
    line-height:1;margin:4px 8px 0 0}

  /* ---------- 照片 ---------- */
  .yearbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .yearbar button{background:var(--surface);border:1.5px solid var(--border);color:var(--ink);
    border-radius:999px;padding:8px 18px;font-size:13.5px;font-weight:700;cursor:pointer;
    transition:.18s;font-family:inherit}
  .yearbar button:hover{border-color:var(--gold)}
  .yearbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .yearbar button .n{font-size:11.5px;opacity:.7;margin-left:6px;font-weight:600}

  .yhead{margin:0 0 16px}
  .yhead h3{margin:0;font-size:17px;color:var(--ink);font-weight:800}
  .yhead p{margin:5px 0 0;font-size:13px;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  .grid figure{margin:0;position:relative;border-radius:10px;overflow:hidden;
    aspect-ratio:1/1;background:#f0e7d8;cursor:zoom-in;box-shadow:0 2px 8px rgba(140,90,40,.09)}
  .grid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
  .grid figure:hover img{transform:scale(1.06)}
  .grid figure .no{position:absolute;left:6px;top:5px;font-size:10.5px;font-weight:700;color:#fff;
    background:rgba(45,20,16,.6);padding:1px 5px;border-radius:4px;opacity:0;transition:.2s}
  .grid figure:hover .no{opacity:1}

  /* ---------- 经验卡 ---------- */
  .les{columns:2;column-gap:16px}
  .lcard{break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:16px}
  .lcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;box-shadow:0 2px 10px rgba(140,90,40,.06)}
  .lcard .gh{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;
    color:var(--accent);margin-bottom:12px;padding-bottom:9px;border-bottom:1px dashed var(--line)}
  .lcard .gh i{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
  .lcard ul{margin:0 0 10px;padding-left:0;list-style:none}
  .lcard li{position:relative;padding-left:22px;font-size:13px;line-height:1.7;margin-bottom:7px;color:#3a2f22}
  .lcard li.g::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800;font-size:13px}
  .lcard li.b::before{content:"!";position:absolute;left:2px;top:0;width:14px;height:14px;
    background:#fbe9e7;color:#b3261e;border-radius:50%;font-size:11px;font-weight:800;
    text-align:center;line-height:14px;margin-top:3px}
  .lcard .tip{background:var(--surface-2);border-left:3px solid var(--gold);border-radius:6px;
    padding:9px 12px;font-size:12.5px;color:#5a4a34;line-height:1.65;margin-top:10px}
  .lcard .tip b{color:var(--accent-2)}

  /* ---------- 亮点 ---------- */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;box-shadow:0 2px 10px rgba(140,90,40,.06)}
  .box h4{margin:0 0 12px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:7px}
  .box.hi h4{color:var(--ok)}
  .box.lo h4{color:#b3261e}
  .box ul{margin:0;padding-left:18px}
  .box li{font-size:13px;line-height:1.75;margin-bottom:6px;color:#3a2f22}

  /* ---------- 财务小结 ---------- */
  .fin{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .fnote{background:#fdf6e8;border-left:3px solid var(--accent-2);border-radius:6px;
    padding:11px 15px;font-size:13px;color:#6b4a2a;line-height:1.7;margin-bottom:14px}
  .fcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 16px}
  .fcard .k{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.4px}
  .fcard .v{font-size:22px;font-weight:800;color:var(--ink);margin-top:5px;line-height:1.2}
  .fcard.gold .v{color:var(--accent)}
  .fcard .d{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
  .fpeople{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .fp{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
    padding:8px 14px;font-size:12.5px;color:#4a3d2c}
  .fp b{color:var(--accent);font-weight:800}
  .fp small{color:var(--muted);font-size:11px}

  /* ---------- 下次待办 ---------- */
  .todo{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:6px 22px;box-shadow:0 2px 10px rgba(140,90,40,.06)}
  .todo ol{margin:0;padding:14px 0 14px 4px;list-style:none;counter-reset:t}
  .todo li{counter-increment:t;position:relative;padding:9px 0 9px 38px;font-size:13.5px;
    line-height:1.65;border-bottom:1px dashed var(--line);color:#3a2f22}
  .todo li:last-child{border-bottom:none}
  .todo li::before{content:counter(t,decimal-leading-zero);position:absolute;left:0;top:9px;
    font-size:12px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}

  footer{margin-top:52px;padding-top:18px;border-top:2px solid var(--gold);
    color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  /* ---------- 灯箱 ---------- */
  #lb{position:fixed;inset:0;background:rgba(20,12,8,.93);z-index:99;display:none;
    align-items:center;justify-content:center;padding:40px}
  #lb.on{display:flex}
  #lb img{max-width:92vw;max-height:82vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #lb .x{position:absolute;top:18px;right:26px;font-size:34px;color:#fff;cursor:pointer;
    line-height:1;opacity:.75}
  #lb .x:hover{opacity:1}
  #lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:#fff;
    cursor:pointer;opacity:.5;user-select:none;padding:14px;line-height:1}
  #lb .nav:hover{opacity:1}
  #lb .prev{left:16px}
  #lb .next{right:16px}
  #lb .cnt{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
    color:#d9c6a8;font-size:13px;letter-spacing:1px}

  @media(max-width:900px){
    .stats{grid-template-columns:repeat(3,1fr)}
    .les{columns:1}
    .two{grid-template-columns:1fr}
    .fin{grid-template-columns:repeat(2,1fr)}
    .cover h1{font-size:27px}
    .cover{aspect-ratio:4/3}
    .cover .ov{padding:22px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
    .story{padding:18px 20px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="cover">
    <img id="cover-img" alt="文化日现场">
    <div class="seal">2026 · 纪念</div>
    <div class="ov">
      <div class="cn">CULTURE DAY 2026</div>
      <h1 id="cv-title"></h1>
      <div class="tl" id="cv-tag"></div>
      <div class="dt" id="cv-date"></div>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="sec-t"><h2>那天</h2><span>从摆盘到收摊</span></div>
  <div class="story" id="story"></div>

  <div class="sec-t"><h2>照片</h2><span>按年份整理 · 点击放大</span></div>
  <div class="yearbar" id="yearbar"></div>
  <div class="yhead" id="yhead"></div>
  <div class="grid" id="grid"></div>

  <div class="sec-t"><h2>经验回顾</h2><span>下次办活动时先看这一页</span></div>
  <div class="les" id="lessons"></div>

  <div class="sec-t"><h2>财务小结</h2><span>2026 · 已结清</span></div>
  <div class="fnote" id="fnote"></div>
  <div class="fin" id="fin"></div>
  <div class="fpeople" id="fpeople"></div>

  <footer>
    <span id="ft-left">文化日 2026 · 中国展台 · 回顾与纪念</span>
    <span>照片按年份归档 · 点击可放大浏览</span>
  </footer>
</div>

<div id="lb">
  <span class="x" onclick="closeLb()">&times;</span>
  <span class="nav prev" onclick="stepLb(-1)">‹</span>
  <img id="lb-img" alt="">
  <span class="nav next" onclick="stepLb(1)">›</span>
  <span class="cnt" id="lb-cnt"></span>
</div>

<script src="photos.js?v=20261021k"></script>
<script src="data.js?v=20261021k"></script>
<script>
const D = window.BOARD;
const P = window.PHOTOS || {2026:[],2025:[]};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 封面 ---------- */
document.title = D.meta.title + ' · ' + D.meta.subtitle;
$('#cv-title').textContent = D.meta.title;
$('#cv-tag').textContent = D.meta.tagline || '';
$('#cv-date').textContent = D.meta.date + ' · ' + D.meta.subtitle;

/* 封面图：data.js 里指定，没指定就退回 2026 的全景图 */
(function(){
  let pick = D.meta.cover || '';
  if(!pick){
    const pool = P[2026] || [];
    pick = pool[3] || pool[10] || pool[0] || '';
  }
  if(pick){ $('#cover-img').src = pick; }
})();

/* ---------- 数字条 ---------- */
$('#stats').innerHTML = (D.recap.stats||[]).map(s=>`
  <div class="stat">
    <div class="v">${esc(s.v)}<small>${esc(s.u||'')}</small></div>
    <div class="k">${esc(s.k)}</div>
    <div class="d">${esc(s.d||'')}</div>
  </div>`).join('');

/* ---------- 故事 ---------- */
$('#story').innerHTML = (D.recap.story||[]).map(p=>`<p>${esc(p)}</p>`).join('');

/* ---------- 照片 ---------- */
let curYear = (D.photoYears[0]||{}).cur || '2026';
let curList = [];

function thumbOf(path){
  const T = window.THUMBS || {};
  if(T[path]) return T[path];
  // assets/photos/2026/g01.jpg → assets/photos/thumbs/2026-g01.jpg
  const m = path.match(/assets\/photos\/(\d{4})\/([^/]+)$/);
  return m ? `assets/photos/thumbs/${m[1]}-${m[2]}` : path;
}

function renderYear(){
  const yrs = D.photoYears || [];
  $('#yearbar').innerHTML = yrs.map(y=>{
    const n = (P[y.cur]||[]).length;
    return `<button data-y="${esc(y.cur)}" class="${y.cur===curYear?'on':''}">
      ${esc(y.year)} 年<span class="n">${n} 张</span></button>`;
  }).join('');
  const meta = yrs.find(y=>y.cur===curYear) || {};
  $('#yhead').innerHTML = `<h3>${esc(meta.title||'')}</h3><p>${esc(meta.caption||'')}</p>`;
  curList = P[curYear] || [];
  $('#grid').innerHTML = curList.map((p,i)=>`
    <figure onclick="openLb(${i})">
      <img loading="${i<12?'eager':'lazy'}" src="${esc(thumbOf(p))}" alt="">
      <span class="no">${i+1}</span>
    </figure>`).join('');
  $('#grid').querySelectorAll('img').forEach(img=>{
    img.onerror = ()=>{ img.style.opacity=.25; };
  });
}
$('#yearbar').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  curYear = b.dataset.y; renderYear();
});
renderYear();

/* ---------- 经验 ---------- */
$('#lessons').innerHTML = (D.lessons||[]).map(g=>`
  <div class="lcard">
    <div class="gh"><i></i>${esc(g.g)}</div>
    <ul>
      ${(g.good||[]).map(t=>`<li class="g">${esc(t)}</li>`).join('')}
      ${(g.bad||[]).map(t=>`<li class="b">${esc(t)}</li>`).join('')}
    </ul>
    ${g.tip?`<div class="tip"><b>经验：</b>${esc(g.tip)}</div>`:''}
  </div>`).join('');

/* ---------- 财务 ---------- */
(function(){
  const f = D.finance || {};
  const s = f.summary || {};
  if(f.note){ $('#fnote').textContent = f.note; } else { $('#fnote').style.display='none'; }
  const cards = [
    { k:'募集收入', v:'S$'+(f.budget||0), d:'韦又嘉 S$200 · Angelian S$200', cls:'' },
    { k:'实际支出', v:'S$'+(s.spentSGD||0), d:'含人民币 ¥'+(s.spentCNY||0)+' 折汇', cls:'' },
    { k:'结余退回', v:'S$'+(s.remainSGD||0), d:'平均退回 2 人', cls:'gold' },
    { k:'每人退回', v:'S$'+(s.perPerson||0), d:'涂 / 韦又嘉', cls:'gold' }
  ];
  $('#fin').innerHTML = cards.map(c=>`
    <div class="fcard ${c.cls}"><div class="k">${esc(c.k)}</div>
      <div class="v">${esc(c.v)}</div><div class="d">${esc(c.d)}</div></div>`).join('');
  $('#fpeople').innerHTML = (f.byPerson||[]).map(p=>`
    <div class="fp">${esc(p.name)} 报销 <b>S$${p.amount.toFixed(2)}</b>
      <small>（${esc(p.orig)} · ${p.cur}）</small></div>`).join('');
})();

/* ---------- 灯箱 ---------- */
let lbIdx = 0;
function openLb(i){
  if(!curList.length) return;
  lbIdx = i;
  $('#lb-img').src = curList[i];
  $('#lb-cnt').textContent = (i+1) + ' / ' + curList.length;
  $('#lb').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeLb(){
  $('#lb').classList.remove('on');
  document.body.style.overflow = '';
}
function stepLb(d){
  if(!curList.length) return;
  lbIdx = (lbIdx + d + curList.length) % curList.length;
  $('#lb-img').src = curList[lbIdx];
  $('#lb-cnt').textContent = (lbIdx+1) + ' / ' + curList.length;
}
document.addEventListener('keydown', e=>{
  if(!$('#lb').classList.contains('on')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft') stepLb(-1);
  if(e.key==='ArrowRight') stepLb(1);
});
</script>
</body>
</html>
